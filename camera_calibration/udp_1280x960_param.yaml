File.version: "1.0"

Camera.type: "PinHole"

# Left Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 1553.8983843862766
Camera1.fy: 1538.5095425441853
Camera1.cx: 771.5714981091915
Camera1.cy: 478.6784648526361

# distortion parameters
Camera1.k1: -0.008903777368353157
Camera1.k2: -0.06312457655136083
